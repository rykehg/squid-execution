# Dev stack for the P-01 DoD (SPEC-0004, ADR-23): `podman compose up -d` from infra/.
# No secret lives in this file (AC-05): only image names, ports, paths and URLs.

services:
  squid:
    build:
      context: ..
      dockerfile: infra/Containerfile
    image: squid-service:dev
    ports:
      - "8080:8080"
    environment:
      # SPEC-0002 GAP-09: OTLP goes to the collector service on the compose network.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      # §4.7 #4: the SQLite file lives in the named volume, not in the image layer.
      Storage__Path: /data/squid-grainstate.db
    volumes:
      - squid-data:/data
    depends_on:
      - collector

  # Dev-only collector (SPEC-0004): Jaeger all-in-one, OTLP in, query API out.
  collector:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"

volumes:
  squid-data:
